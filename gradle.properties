# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.122
neo_version_range=[26.1.2.81,)
loader_version_range=[4,)

# Optional Silent Gear integration artifacts. Runtime needs the CLEAN (non-shadowed) Silent Gear
# jar: the fleet jar embeds Silent Lib classes while its neoforge.mods.toml still requires
# silentlib, so the two forms cannot be combined on one module path.
silentgear_jar=../pack-libs/compat/silent-gear-26.1.2-neoforge-4.2.3.jar
silentlib_jar=../pack-libs/compat/silent-lib-26.1.2-neoforge-11.2.0.jar

# Mod Properties
mod_id=beheading
mod_name=Beheading
mod_license=MIT
mod_version=0.2.0
mod_group_id=ru.mehtm.beheading
